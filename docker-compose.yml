services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ROCKFALL_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      MODEL_PATH: ml/models/rockfall_pipeline.joblib
    volumes:
      - ./ml/models:/app/ml/models:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
